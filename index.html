<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MovieRama</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            href="dist/assets/fontawesome/css/fontawesome.min.css"
            rel="stylesheet"
        />
        <link
            href="dist/assets/fontawesome/css/regular.min.css"
            rel="stylesheet"
        />
        <link
            href="dist/assets/fontawesome/css/solid.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="dist/css/bundle.css" />
    </head>
    <body>
        <header id="header">
            <div class="container">
                <h1><i class="fa-solid fa-film"></i> MovieRama</h1>
            </div>
        </header>
        <main id="main">
            <div class="container">
                <div class="section-title">
                    <h2>Now Playing</h2>
                    <div class="searc-area">
                        <form action="/">
                            <input
                                type="text"
                                placeholder="Search..."
                                data-movie-search
                            />
                        </form>
                    </div>
                </div>

                <div
                    class="movies-list"
                    data-movies-list
                    data-movies-page="1"
                    data-movies-results="nowPlaying"
                ></div>
            </div>
            <div id="movie-details"></div>
        </main>
        <footer id="footer">
            <div class="container">Vasilis Tziatzias</div>
        </footer>
    </body>
    <script src="dist/js/main.js"></script>
</html>
